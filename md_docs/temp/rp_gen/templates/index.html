<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>rp_gen — 보고서 생성기</title>
<link rel="stylesheet" href="/static/report.css?v={{ ver }}">
<style>
  *{box-sizing:border-box}
  body{margin:0;font-family:"맑은 고딕","Malgun Gothic",sans-serif;background:#5b6472;
       display:flex;height:100vh;overflow:hidden}
  #left{width:420px;flex:none;background:#252b33;color:#dfe4ea;
        display:none;flex-direction:column}
  #src{flex:1;width:100%;border:0;resize:none;padding:12px;background:#1b2027;color:#c8d3e0;
       font-family:Consolas,"D2Coding",monospace;font-size:12px;line-height:1.55;outline:none}
  #right{flex:1;display:flex;flex-direction:column;min-width:0}
  #bar{padding:8px 14px;background:#333b45;color:#e6ebf1;display:flex;align-items:center;
       gap:10px;font-size:13px;flex:none;border-bottom:1px solid #222}
  #bar .sp{flex:1}
  #bar select{padding:5px 8px;background:#1b2027;color:#dfe4ea;border:1px solid #48525f;
              border-radius:4px;font-size:13px;max-width:290px}
  button{padding:6px 12px;border:0;border-radius:4px;font-size:13px;cursor:pointer;
         font-family:inherit}
  .pri{background:#2563eb;color:#fff}.sec{background:#4a5563;color:#e6ebf1}
  .pri:disabled{background:#39485f;color:#8b97a8;cursor:default}
  #bold{font-weight:bold;width:32px;padding:6px 0}
  #dirty{display:none;color:#ffd479}
  #msg{font-size:12px;color:#9fb0c4}
  #view{flex:1;overflow:auto;padding:22px 0 40px}
  .hint{font-size:11.5px;color:#94a3b8}
  #err{display:none;background:#7f1d1d;color:#fee;padding:8px 14px;font-size:12.5px;
       font-family:Consolas,monospace;white-space:pre-wrap;border-bottom:1px solid #b91c1c}
</style>
</head>
<body>

<div id="left" class="noprint">
  <textarea id="src" spellcheck="false"></textarea>
</div>

<div id="right">
  <div id="bar" class="noprint">
    <select id="docs"></select>
    <button class="sec" id="bold" title="굵게 (Ctrl+B)">B</button>
    <button class="sec" id="newpage" title="선택한 블록 앞에서 새 페이지 시작">＋페이지</button>
    <span id="pages">— 쪽</span>
    <span id="dirty">● 수정됨</span>
    <span id="warn" style="color:#ffb4b4"></span>
    <span class="sp"></span>
    <span id="build" class="hint" title="이 값이 안 보이면 옛 파일이 캐시된 상태입니다"></span>
    <span class="hint">글자 클릭 → 수정 · 왼쪽 ✕ → 블록 삭제 · 표 헤더 경계 드래그 → 열 너비</span>
    <button class="sec" id="toggle-src">소스 보기</button>
    <button class="sec" id="reload">다시 그리기</button>
    <button class="sec" id="revert">되돌리기</button>
    <button class="pri" id="save" disabled>저장</button>
    <button class="pri" id="pdf">PDF로 저장</button>
    <span id="msg"></span>
  </div>
  <div id="err" class="noprint"></div>
  <div id="view"></div>
</div>

<script src="/static/paginate.js?v={{ ver }}"></script>
<script src="/static/app.js?v={{ ver }}"></script>
</body>
</html>
